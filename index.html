    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #030308;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            padding: 0;

        }

        /* Canvas background for stars */
        #particleCanvas {
            position: fixed;

        }

        /* Glowing Neon Border Effects */
        .neon-card-border {

                        0 0 50px rgba(224, 0, 255, 0.35);

        /* Circular Countdown Progress Ring */

<body class="flex items-center justify-center min-h-screen p-4 relative">

    <canvas id="particleCanvas"></canvas>

    <!-- Main Container -->

        <div class="w-full neon-card-border p-6 flex flex-col items-center text-center space-y-6 bg-black/90 backdrop-blur-md">
            
            <!-- Title -->

            </h1>

        <!-- Footer Info -->

            Official Safe Link • High Speed Redirection
        </p>

    </div>

    <script>
        /* Particles Canvas Background Effect */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 120;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random();
                this.fade = Math.random() * 0.02 + 0.005;
                this.fadeDirection = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Twinkle opacity effect
                this.opacity += this.fade * this.fadeDirection;
                if (this.opacity >= 1 || this.opacity <= 0.1) {
                    this.fadeDirection *= -1;
                }

                // Wrap around edges
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, this.opacity)})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#ffffff";
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        /* Countdown & Auto Redirect Logic */
        const telegramUrl = "https://t.me/+uECO1q_eLqJiMmRl";
        let timeLeft = 15; // 15 seconds timer

        const countdownSecEl = document.getElementById('countdownSec');
        const autoSecEl = document.getElementById('autoSec');

        const timerInterval = setInterval(() => {
            timeLeft--;

            if (timeLeft >= 0) {
                // Update text display
                countdownSecEl.textContent = `.${timeLeft < 10 ? '0' + timeLeft : timeLeft}`;
                autoSecEl.textContent = timeLeft;
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                // Auto redirect to Telegram Link
                window.location.href = telegramUrl;
            }
        }, 1000);

        // Click event tracking for manual join
        document.getElementById('joinBtn').addEventListener('click', function() {
            // Instant redirect when clicked
            window.location.href = telegramUrl;
        });
    </script>
